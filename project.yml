# XcodeGen spec — run `xcodegen generate` to create LaxPocket.xcodeproj
name: LaxPocket
options:
  bundleIdPrefix: com.princa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  LaxPocketCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LaxPocket:
    type: application
    platform: iOS
    sources:
      # A synchronized folder (Xcode 16+): Xcode picks up files added, renamed or removed under LaxPocket/ by itself,
      # so they don't need the project regenerated. Only a change to this file does. XcodeGen leaves the generated
      # Info.plist out of the app's resources.
      # Includes LaxPocket/Resources/Supabase.plist, which points the app at the LaxPocket
      # Supabase project; without it, cloud sync is off. See docs/supabase.md.
      - path: LaxPocket
        type: syncedFolder
    dependencies:
      - package: LaxPocketCore
    # The signing team comes from Config/Local.xcconfig (not committed), so regenerating keeps it. See scripts/setup-mac.sh.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: LaxPocket/Info.plist
      properties:
        # The app is called SportsPocket on the phone. The project, bundle ID, URL scheme and code keep the LaxPocket
        # name: a new bundle ID would install a separate app without the athletes saved on the phone.
        CFBundleDisplayName: SportsPocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSupportsIndirectInputEvents: true
        # laxpocket://auth-callback: the link in Supabase's confirmation email opens the app and signs in.
        CFBundleURLTypes:
          - CFBundleURLName: com.princa.laxpocket
            CFBundleURLSchemes:
              - laxpocket
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.princa.laxpocket
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: >-
          AppIcon-Northwestern AppIcon-NorthCarolina AppIcon-JohnsHopkins AppIcon-Maryland AppIcon-Colorado
          AppIcon-StonyBrook AppIcon-Stanford AppIcon-Navy AppIcon-Michigan AppIcon-Syracuse

schemes:
  LaxPocket:
    build:
      targets:
        LaxPocket: all
    run:
      config: Debug
    archive:
      config: Release
