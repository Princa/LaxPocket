# Supabase CLI settings for the LaxPocket project (used by `supabase start` / `supabase db push`).
# Anything not listed here uses the CLI defaults.
project_id = "LaxPocket"

[api]
enabled = true
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# The confirmation email's link opens the app (CloudStore.authRedirectURL).
additional_redirect_urls = ["laxpocket://auth-callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
