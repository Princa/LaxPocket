name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test LaxPocketCore
        working-directory: Core
        run: ../scripts/ci-run.sh "Core tests (Linux)" ../core-tests-linux.log swift test

  supabase:
    name: Supabase schema & sync (Linux)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Schema and row-level security checks
        run: scripts/ci-run.sh "Supabase schema" schema.log supabase/tests/run-local.sh
      - name: Start PostgREST
        shell: bash
        run: supabase/tests/start-postgrest.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Sync against PostgREST
        working-directory: Core
        env:
          LAXPOCKET_E2E_REQUIRED: "1"
        run: ../scripts/ci-run.sh "Cloud sync (PostgREST)" ../sync.log swift test --filter CloudSyncIntegrationTests
      - name: PostgREST log
        if: failure()
        run: docker logs laxpocket-postgrest || true

  ios-build:
    name: iOS app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Supabase.plist present
        # A fork without one gets the placeholder, which leaves cloud sync off.
        run: test -f LaxPocket/Resources/Supabase.plist || cp supabase/Supabase.example.plist LaxPocket/Resources/Supabase.plist
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Core tests (macOS)
        working-directory: Core
        run: ../scripts/ci-run.sh "Core tests (macOS)" ../core-tests-macos.log swift test
      - name: Build app for iOS Simulator
        # Runs even when the Core tests fail, so one CI run reports both.
        if: success() || failure()
        run: |
          scripts/ci-run.sh "iOS build" build.log \
            xcodebuild -project LaxPocket.xcodeproj -scheme LaxPocket \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Check Supabase.plist is bundled
        run: test -f build/Build/Products/Debug-iphonesimulator/LaxPocket.app/Supabase.plist
      - name: Upload build log and generated project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            core-tests-macos.log
            LaxPocket.xcodeproj
          if-no-files-found: ignore
