name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test LaxPocketCore
        working-directory: Core
        run: ../scripts/ci-run.sh "Core tests (Linux)" ../core-tests-linux.log swift test

  ios-build:
    name: iOS app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Core tests (macOS)
        working-directory: Core
        run: ../scripts/ci-run.sh "Core tests (macOS)" ../core-tests-macos.log swift test
      - name: Build app for iOS Simulator
        # Runs even when the Core tests fail, so one CI run reports both.
        if: success() || failure()
        run: |
          scripts/ci-run.sh "iOS build" build.log \
            xcodebuild -project LaxPocket.xcodeproj -scheme LaxPocket \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Upload build log and generated project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            core-tests-macos.log
            LaxPocket.xcodeproj
          if-no-files-found: ignore
